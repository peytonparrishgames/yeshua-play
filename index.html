<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Yeshua - play in your browser</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0806; }
      #game { position: fixed; inset: 0; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #0a0806; outline: none; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        /* Cut stone under a pool of light, like the game's windows (v0.32). */
        background:
          radial-gradient(ellipse at center, rgba(40, 32, 22, 0.35) 0%, rgba(10, 8, 6, 0.96) 72%),
          repeating-linear-gradient(0deg, #0e0c0a 0 3px, transparent 3px 44px),
          repeating-linear-gradient(90deg, #0e0c0a 0 3px, transparent 3px 88px),
          linear-gradient(#26211c, #1b1814);
        font-family: Georgia, "Times New Roman", serif; color: #e4c070; text-align: center;
      }
      #title { font-size: clamp(42px, 8vw, 96px); letter-spacing: 0.12em; text-shadow: 0 0 18px rgba(228, 192, 112, 0.35), 0 3px 0 #3d2c10; }
      #subtitle { margin-top: 4px; font-size: clamp(14px, 2vw, 20px); letter-spacing: 0.4em; color: #b8a27a; }
      #bar { margin-top: 36px; width: min(420px, 70vw); height: 18px; padding: 3px; background: #2f2a25;
             border: 2px solid #6d645a; border-bottom-color: #16130f; border-right-color: #16130f; box-shadow: 0 0 0 2px #0a0806, 0 0 0 3px #b8913c; }
      #fill { height: 100%; width: 0%; background: linear-gradient(#f0d070, #b8913c 60%, #6e5420); transition: width 0.2s; }
      #status { margin-top: 14px; font-size: 14px; color: #8a7d6a; letter-spacing: 0.1em; }
      #keys { margin-top: 26px; font-size: 13px; color: #a8987c; letter-spacing: 0.12em; line-height: 1.9; max-width: 90vw; }
      #keys b { color: #e4c070; font-weight: normal; padding: 1px 6px; border: 1px solid #6d645a; background: #2f2a25; margin: 0 2px; }
      #verse { position: absolute; bottom: 28px; font-size: 13px; color: #6e6452; letter-spacing: 0.08em; padding: 0 16px; }
      #fullscreen { position: fixed; right: 12px; top: 10px; padding: 6px 10px; font: 12px Georgia, serif; color: #e4c070;
                    background: #2f2a25; border: 2px solid #6d645a; border-bottom-color: #16130f; border-right-color: #16130f;
                    cursor: pointer; opacity: 0.55; display: none; }
      #fullscreen:hover { opacity: 1; }
      #warning { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); max-width: 80vw; font: 13px Georgia, serif; }
      #warning div { padding: 8px 12px; margin-bottom: 6px; background: #3a2a10; color: #f0e0b0; border: 1px solid #b8913c; }
    </style>
  </head>
  <body>
    <div id="game"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading">
      <div id="title">YESHUA</div>
      <div id="subtitle">THE HERALDS</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="status">Loading...</div>
      <div id="keys"><b>WASD</b> MOVE &nbsp; YOUR WEAPONS STRIKE ON THEIR OWN &nbsp; <b>SPACE</b> DASH<br><b>ESC</b> MENU &nbsp; <b>M</b> MAP &nbsp; <b>C</b> HERALD &nbsp; <b>I</b> ITEMS &nbsp; <b>B</b> WEAPONS &nbsp; <b>1</b> <b>2</b> BREAD</div>
      <div id="verse">"Your kingdom come, your will be done, on earth as it is in heaven." (Matthew 6:10)</div>
    </div>
    <div id="fullscreen" title="Fullscreen">FULLSCREEN</div>
    <div id="warning"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {
        var box = document.querySelector("#warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        if (type == "error") div.style.background = "#6a1010";
        box.appendChild(div);
        if (type != "error") setTimeout(function () { box.removeChild(div); }, 6000);
      }
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Peyton Parrish Games",
        productName: "Yeshua",
        productVersion: "0.80.0",
        showBanner: unityShowBanner,
      };
      // Saves (the treasury, hero, chests) persist in the browser between visits.
      config.autoSyncPersistentDataPath = true;
      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = Math.round(100 * progress) + "%";
          document.querySelector("#status").textContent = progress < 0.9 ? "Loading... " + Math.round(100 * progress) + "%" : "Preparing the Heralds...";
        }).then(function (instance) {
          document.querySelector("#loading").style.display = "none";
          var fs = document.querySelector("#fullscreen");
          fs.style.display = "block";
          fs.onclick = function () { instance.SetFullscreen(1); };
          canvas.focus();
        }).catch(function (message) {
          document.querySelector("#status").textContent = "Could not start: " + message;
        });
      };
      document.body.appendChild(script);
      canvas.addEventListener("click", function () { canvas.focus(); });
    </script>
  </body>
</html>
